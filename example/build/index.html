<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Погружение</title>

<style>
  @font-face {
    font-family: 'baseFont4';
    src: url('./MixSerifCondenseRUSbyDumpyCats-Condense.ttf') format("truetype")
  }
  body {cursor:url('./images/UI/cur.png'), auto}
  /* МИГРАЦИЯ (PixiJS): канвас движка — элемент потока, и дефолтный margin body (8px)
     сдвигал его от угла: белые полосы сверху/слева и «съехавший» экран. SVG-слои были
     position:absolute в (0,0) вьюпорта — канвас обязан стоять так же. Фон чёрный:
     у слоя пола (svg[0] background:black) он был частью SVG, канвас letterbox-зоны
     закрашивает им же */
  html, body { margin: 0; padding: 0; overflow: hidden; background: #000; }
  canvas { display: block; }
</style>
</head>
<body>
    <!-- МИГРАЦИЯ (2026-09-16): рендер переведён с SVG на PixiJS через ядро zero_engine.
         Классические скрипты ядра грузятся ДО модуля игры (ставят глобали PIXI/ECS/world). -->
    <script src="./engine/dll/pixi.min.js"></script>
    <script src="./engine/scripts/engine/eventSystem.js"></script>
    <script src="./engine/scripts/engine/engine.js"></script>
    <script type="module" src="index.js"></script>
  </body>
</html>
